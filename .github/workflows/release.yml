name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: build/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            ccache \
            qemu-user qemu-user-static \
            device-tree-compiler u-boot-tools \
            python3 cpio gzip xz-utils \
            binutils-aarch64-linux-gnu \
            zip

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Configure ccache
        run: |
          # NOTE: do NOT set KERNEL_REF here. The pin is committed in
          # config/source-lock.env and CI must build exactly that. Appending
          # "KERNEL_REF=$(git rev-parse HEAD)" would put the *builder repo's*
          # commit into the lock file, overriding the kernel pin - the fetch
          # then asks the kernel remote for a commit it does not have and
          # fails with "upload-pack: not our ref".
          mkdir -p build/.ccache
          echo "CCACHE_DIR=build/.ccache" >> config/build.env
          echo "CCACHE_COMPILERCHECK=content" >> config/build.env
          ccache --max-size=2G
          ccache --show-stats
          cat config/source-lock.env

      - name: Set up SSH authorized key
        run: |
          if [ -z "${{ secrets.WDMCH_SSH_AUTHORIZED_KEY }}" ]; then
            echo "ERROR: WDMCH_SSH_AUTHORIZED_KEY is required for release builds" >&2
            exit 1
          fi
          mkdir -p rootfs/overlay/root/.ssh
          echo "${{ secrets.WDMCH_SSH_AUTHORIZED_KEY }}" > rootfs/overlay/root/.ssh/authorized_keys
          chmod 700 rootfs/overlay/root/.ssh
          chmod 600 rootfs/overlay/root/.ssh/authorized_keys
          echo "SSH authorized key configured"

      - name: Build complete image
        env:
          WDMCH_SSH_AUTHORIZED_KEY: ${{ secrets.WDMCH_SSH_AUTHORIZED_KEY }}
        run: |
          export CC="ccache aarch64-linux-gnu-gcc"
          export CROSS_TARGET="aarch64-linux-gnu"
          export CROSS_COMPILE="${CROSS_TARGET}-"
          ./build-image.sh --clean
          ./build-image.sh

      - name: Run all tests
        run: |
          # `make test` is the single source of truth for the suite: it runs
          # `validate` (image header, FDT, artifacts, test_tools) plus every
          # test script. Naming a count here would just go stale again - it
          # said "seven" when it was nine. Hand-picking a few of them meant
          # test_rootfs, test_install_verify, test_dtb and
          # test_kernel_metadata never ran in CI at all, so their guards
          # existed only on this machine.
          # ci-run-tests.sh, not a bare `make test`: see the note in
          # build.yml. A failing step whose log is empty is not a result.
          bash tools/ci-run-tests.sh
          # smoke.sh is inside `make test` now. It was called by hand here AND
          # absent from the local suite, which meant the one test that executes
          # aarch64 code ran only in this workflow - never on a developer
          # machine, and never in the Validate lane.

      - name: Create release archive
        run: |
          VERSION=$(cat VERSION)
          # Create full release archive
          tar -cJf "alpine-wdmch-rescue-${VERSION}.tar.xz" \
            --exclude='.git' \
            --exclude='*.pyc' \
            build/release/
          # This job builds the image from source (./build-image.sh ->
          # image/package-rescue.sh), so the FULL flash.zip with all APKs is
          # already in the workspace at build/flash.zip. There is no artifact to
          # download: build.yml does not trigger on tag pushes, and this run
          # uploads no artifacts, so actions/download-artifact (which defaults
          # to the CURRENT run) would fail to find wdmch-rescue-release.
          test -s build/flash.zip || { echo "FAIL: build/flash.zip missing or empty"; exit 1; }
          APK_COUNT=$(unzip -l build/flash.zip | grep -c '\.apk$' || true)
          echo "flash.zip contains $APK_COUNT APK packages"
          if [ "$APK_COUNT" -lt 20 ]; then
            echo "FAIL: flash.zip has only $APK_COUNT APKs (< 20) — offline repo incomplete" >&2
            exit 1
          fi
          cp build/flash.zip "alpine-wdmch-rescue-${VERSION}-flash.zip"
          ls -lh "alpine-wdmch-rescue-${VERSION}-flash.zip"

      - name: Copy release artifacts for GitHub Release
        run: |
          VERSION=$(cat VERSION)
          cp build/release/SHA256SUMS .
          cp build/release/manifest.json .

      - name: Publish GitHub Release
        run: |
          VERSION=$(cat VERSION)
          TAG="v${VERSION}"
          # `gh release create` has no --force flag (it aborts with
          # "unknown flag: --force"), and it refuses to overwrite an existing
          # release. Delete the release first so a re-run is idempotent;
          # --yes skips the prompt and the git tag is kept (--cleanup-tag is
          # opt-in), so the pushed tag is never disturbed.
          if gh release view "$TAG" --repo dominicusin/alpine-wdmch-builder >/dev/null 2>&1; then
            echo "release $TAG already exists - replacing it"
            gh release delete "$TAG" --repo dominicusin/alpine-wdmch-builder --yes
          fi
          gh release create "$TAG" \
            --title "WDMCH Rescue Image ${TAG}" \
            --repo dominicusin/alpine-wdmch-builder \
            --verify-tag \
            --generate-notes \
            "alpine-wdmch-rescue-${VERSION}-flash.zip" \
            "SHA256SUMS" \
            "manifest.json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-dry-run:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: build/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            ccache \
            qemu-user qemu-user-static \
            device-tree-compiler u-boot-tools \
            python3 cpio gzip xz-utils \
            binutils-aarch64-linux-gnu \
            zip

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Configure ccache
        run: |
          # NOTE: do NOT set KERNEL_REF here. The pin is committed in
          # config/source-lock.env and CI must build exactly that. Appending
          # "KERNEL_REF=$(git rev-parse HEAD)" would put the *builder repo's*
          # commit into the lock file, overriding the kernel pin - the fetch
          # then asks the kernel remote for a commit it does not have and
          # fails with "upload-pack: not our ref".
          mkdir -p build/.ccache
          echo "CCACHE_DIR=build/.ccache" >> config/build.env
          echo "CCACHE_COMPILERCHECK=content" >> config/build.env
          ccache --max-size=2G
          ccache --show-stats

      - name: Dry run release build
        env:
          WDMCH_SSH_AUTHORIZED_KEY: ${{ secrets.WDMCH_SSH_AUTHORIZED_KEY }}
        run: |
          export CC="ccache aarch64-linux-gnu-gcc"
          export CROSS_TARGET="aarch64-linux-gnu"
          export CROSS_COMPILE="${CROSS_TARGET}-"
          ./build-image.sh --help
          ./build-image.sh --dry-run
          ./build-image.sh --clean
          ./build-image.sh

      - name: Run tests
        run: |
          # Same suite as the release job, for the same reason: a partial
          # list means a guard that only ever runs on one machine.
          # ci-run-tests.sh, not a bare `make test`: see the note in
          # build.yml. A failing step whose log is empty is not a result.
          bash tools/ci-run-tests.sh
          # smoke.sh is inside `make test` now. It was called by hand here AND
          # absent from the local suite, which meant the one test that executes
          # aarch64 code ran only in this workflow - never on a developer
          # machine, and never in the Validate lane.

name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: build/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            ccache \
            qemu-user qemu-user-static \
            device-tree-compiler u-boot-tools \
            python3 cpio gzip xz-utils \
            binutils-aarch64-linux-gnu \
            zip

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Configure kernel reference and ccache
        run: |
          echo "KERNEL_REF=$(git rev-parse HEAD)" >> config/source-lock.env
          mkdir -p build/.ccache
          echo "CCACHE_DIR=build/.ccache" >> config/build.env
          echo "CCACHE_COMPILERCHECK=content" >> config/build.env
          ccache --max-size=2G
          ccache --show-stats
          cat config/source-lock.env

      - name: Set up SSH authorized key
        run: |
          if [ -z "${{ secrets.WDMCH_SSH_AUTHORIZED_KEY }}" ]; then
            echo "ERROR: WDMCH_SSH_AUTHORIZED_KEY is required for release builds" >&2
            exit 1
          fi
          mkdir -p rootfs/overlay/root/.ssh
          echo "${{ secrets.WDMCH_SSH_AUTHORIZED_KEY }}" > rootfs/overlay/root/.ssh/authorized_keys
          chmod 700 rootfs/overlay/root/.ssh
          chmod 600 rootfs/overlay/root/.ssh/authorized_keys
          echo "SSH authorized key configured"

      - name: Build complete image
        run: |
          export CC="ccache aarch64-linux-gnu-gcc"
          export CROSS_TARGET="aarch64-linux-gnu"
          export CROSS_COMPILE="${CROSS_TARGET}-"
          ./build-image.sh --clean
          ./build-image.sh

      - name: Run all tests
        run: |
          bash tests/test_tools.sh
          bash tests/test_workflows.sh
          bash tests/qemu/smoke.sh build/rootfs "$(cat build/kernel/kernel-release.txt)"

      - name: Create release archive
        run: |
          VERSION=$(cat VERSION)
          # Create full release archive
          tar -cJf "alpine-wdmch-rescue-${VERSION}.tar.xz" \
            --exclude='.git' \
            --exclude='*.pyc' \
            build/release/
          # Create release zip of USB flash contents
          cd build/release
          zip -j "../../alpine-wdmch-rescue-${VERSION}-flash.zip" \
            sata.uImage \
            rescue.sata.dtb \
            rescue.root.sata.cpio.gz_pad.img \
            SHA256SUMS \
            manifest.json
          cd ../..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            alpine-wdmch-rescue-*-flash.zip
            SHA256SUMS
            manifest.json
          body: |
            # WDMCH Alpine Rescue Image v${VERSION}
            ## Device
            - WD My Cloud Home (single-bay)
            - Realtek RTD1295
            - ARM64 / aarch64
            ## Artifacts
            See [docs/usb-rescue.md](docs/usb-rescue.md) for USB boot instructions.
            ## Security
            - Root SSH uses public-key authentication only

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          asset_path: alpine-wdmch-rescue-${{ github.ref_name }}-flash.zip
          asset_name: alpine-wdmch-rescue-${{ github.ref_name }}-flash.zip
          asset_content_type: application/zip

  release-dry-run:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: build/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            ccache \
            qemu-user qemu-user-static \
            device-tree-compiler u-boot-tools \
            python3 cpio gzip xz-utils \
            binutils-aarch64-linux-gnu \
            zip

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Configure kernel reference and ccache
        run: |
          echo "KERNEL_REF=$(git rev-parse HEAD)" >> config/source-lock.env
          mkdir -p build/.ccache
          echo "CCACHE_DIR=build/.ccache" >> config/build.env
          echo "CCACHE_COMPILERCHECK=content" >> config/build.env
          ccache --max-size=2G
          ccache --show-stats

      - name: Dry run release build
        run: |
          export CC="ccache aarch64-linux-gnu-gcc"
          export CROSS_TARGET="aarch64-linux-gnu"
          export CROSS_COMPILE="${CROSS_TARGET}-"
          ./build-image.sh --help
          ./build-image.sh --dry-run
          ./build-image.sh --clean
          ./build-image.sh

      - name: Run tests
        run: |
          bash tests/test_tools.sh
          bash tests/test_workflows.sh
          bash tests/qemu/smoke.sh build/rootfs "$(cat build/kernel/kernel-release.txt)"
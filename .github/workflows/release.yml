name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            dtc u-boot-tools qemu-user-static qemu-user-binfmt \
            python3 cpio gzip xz-utils \
            crossbuild-essential-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Register QEMU binfmt
        run: qemu-user-static --reset -p yes || true

      - name: Build complete image
        run: |
          ./build-image.sh --clean
          ./build-image.sh

      - name: Run all tests
        run: |
          bash tests/test_tools.sh
          bash tests/test_workflows.sh
          bash tests/qemu/smoke.sh build/rootfs "$(cat build/kernel/kernel-release.txt)"

      - name: Create release archive
        run: |
          VERSION=$(cat VERSION)
          tar -cJf "alpine-wdmch-rescue-${VERSION}.tar.xz" \
            --exclude='.git' \
            --exclude='*.pyc' \
            build/release/
          tar -cJf "alpine-wdmch-rescue-${VERSION}.img.xz" \
            --exclude='.git' \
            --exclude='*.pyc' \
            build/release/rescue.root.sata.cpio.gz_pad.img

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            alpine-wdmch-rescue-*.tar.xz
            alpine-wdmch-rescue-*.img.xz
            SHA256SUMS
            manifest.json
          body: |
            # WDMCH Alpine Rescue Image v${VERSION}
            
            ## Device
            - WD My Cloud Home (single-bay)
            - Realtek RTD1295
            - ARM64 / aarch64
            
            ## Artifacts
            See [docs/usb-rescue.md](docs/usb-rescue.md) for USB boot instructions.
            
            ## WARNING
            - DO NOT boot GOLD partition
            - DO NOT write A/B/GOLD firmware slots
            - USB rescue is read-only with respect to NAS
            
            ## Security
            - Root SSH uses public-key authentication only
            - No private keys stored in this release

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

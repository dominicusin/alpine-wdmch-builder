name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: build/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            ccache \
            qemu-user qemu-user-static \
            device-tree-compiler u-boot-tools \
            python3 cpio gzip xz-utils \
            binutils-aarch64-linux-gnu \
            zip

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Configure kernel reference and ccache
        run: |
          echo "KERNEL_REF=$(git rev-parse HEAD)" >> config/source-lock.env
          mkdir -p build/.ccache
          echo "CCACHE_DIR=build/.ccache" >> config/build.env
          echo "CCACHE_COMPILERCHECK=content" >> config/build.env
          ccache --max-size=2G
          ccache --show-stats
          cat config/source-lock.env

      - name: Set up SSH authorized key
        run: |
          if [ -z "${{ secrets.WDMCH_SSH_AUTHORIZED_KEY }}" ]; then
            echo "ERROR: WDMCH_SSH_AUTHORIZED_KEY is required for release builds" >&2
            exit 1
          fi
          mkdir -p rootfs/overlay/root/.ssh
          echo "${{ secrets.WDMCH_SSH_AUTHORIZED_KEY }}" > rootfs/overlay/root/.ssh/authorized_keys
          chmod 700 rootfs/overlay/root/.ssh
          chmod 600 rootfs/overlay/root/.ssh/authorized_keys
          echo "SSH authorized key configured"

      - name: Build complete image
        env:
          WDMCH_SSH_AUTHORIZED_KEY: ${{ secrets.WDMCH_SSH_AUTHORIZED_KEY }}
        run: |
          export CC="ccache aarch64-linux-gnu-gcc"
          export CROSS_TARGET="aarch64-linux-gnu"
          export CROSS_COMPILE="${CROSS_TARGET}-"
          ./build-image.sh --clean
          ./build-image.sh

      - name: Run all tests
        run: |
          bash tests/test_tools.sh
          bash tests/test_workflows.sh
          bash tests/qemu/smoke.sh build/rootfs "$(cat build/kernel/kernel-release.txt)"

      - name: Create release archive
        run: |
          VERSION=$(cat VERSION)
          # Create full release archive
          tar -cJf "alpine-wdmch-rescue-${VERSION}.tar.xz" \
            --exclude='.git' \
            --exclude='*.pyc' \
            build/release/
          # Use the FULL flash.zip from build artifacts (includes all APKs)
          cp release-artifacts/flash.zip "alpine-wdmch-rescue-${VERSION}-flash.zip"
          ls -lh "alpine-wdmch-rescue-${VERSION}-flash.zip"

      - name: Copy release artifacts for GitHub Release
        run: |
          VERSION=$(cat VERSION)
          cp build/release/SHA256SUMS .
          cp build/release/manifest.json .

      - name: Publish GitHub Release
        run: |
          VERSION=$(cat VERSION)
          gh release create "v${VERSION}" \
            --title "WDMCH Rescue Image v${VERSION}" \
            --repo dominicusin/alpine-wdmch-builder \
            --generate-notes \
            --file "alpine-wdmch-rescue-${VERSION}-flash.zip" \
            --file "SHA256SUMS" \
            --file "manifest.json" || \
          echo "Release already exists, updating..." && \
          gh release edit "v${VERSION}" --add-file "alpine-wdmch-rescue-${VERSION}-flash.zip" --add-file "SHA256SUMS" --add-file "manifest.json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-dry-run:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: build/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            ccache \
            qemu-user qemu-user-static \
            device-tree-compiler u-boot-tools \
            python3 cpio gzip xz-utils \
            binutils-aarch64-linux-gnu \
            zip

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Configure kernel reference and ccache
        run: |
          echo "KERNEL_REF=$(git rev-parse HEAD)" >> config/source-lock.env
          mkdir -p build/.ccache
          echo "CCACHE_DIR=build/.ccache" >> config/build.env
          echo "CCACHE_COMPILERCHECK=content" >> config/build.env
          ccache --max-size=2G
          ccache --show-stats

      - name: Dry run release build
        env:
          WDMCH_SSH_AUTHORIZED_KEY: ${{ secrets.WDMCH_SSH_AUTHORIZED_KEY }}
        run: |
          export CC="ccache aarch64-linux-gnu-gcc"
          export CROSS_TARGET="aarch64-linux-gnu"
          export CROSS_COMPILE="${CROSS_TARGET}-"
          ./build-image.sh --help
          ./build-image.sh --dry-run
          ./build-image.sh --clean
          ./build-image.sh

      - name: Run tests
        run: |
          bash tests/test_tools.sh
          bash tests/test_workflows.sh
          bash tests/qemu/smoke.sh build/rootfs "$(cat build/kernel/kernel-release.txt)"
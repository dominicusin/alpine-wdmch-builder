name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate shell scripts
        run: |
          shellcheck build-image.sh kernel/build-kernel.sh kernel/fetch-kernel.sh dtb/build-dtb.sh tools/check-deps.sh
          shellcheck rootfs/build-rootfs.sh image/package-rescue.sh image/dl-packages.sh

      - name: Validate Python scripts (syntax only)
        run: |
          python3 -m py_compile tools/check-image-header.py tools/check-fdt.py image/resolve-deps.py
          echo "Python syntax OK"

      - name: Validate kernel config against spec
        run: |
          python3 -c "
          cfg = open('config/kernel.config').read()
          # The rescue image builds NO kernel modules: every driver it needs
          # is built in, because nothing can modprobe before /init runs. The
          # storage/network/filesystem symbols are therefore load-bearing and
          # must stay '=y'.
          required = [
              'CONFIG_AHCI_RTD1295',
              'CONFIG_R8169SOC',
              'CONFIG_PHY_RTK_RTD_SATAPHY',
              'CONFIG_USB_STORAGE',
              'CONFIG_USB_DWC3',
              'CONFIG_EXT4_FS',
              'CONFIG_VFAT_FS',
              'CONFIG_INET',
              # without BINFMT_SCRIPT the kernel panics 'Failed to execute
              # /init (error -8)' - /init is a shell script
              'CONFIG_BINFMT_SCRIPT',
              # without AF_PACKET udhcpc cannot send DHCPDISCOVER at all
              'CONFIG_PACKET',
              'CONFIG_BLK_DEV_INITRD',
              'CONFIG_RD_GZIP',
              'CONFIG_SERIAL_8250_CONSOLE',
              'CONFIG_KEXEC',
          ]
          missing = [k for k in required if k not in cfg]
          assert not missing, f'Missing kernel config: {missing}'
          # Anything load-bearing must be built in, not modular.
          modular = [k for k in required if k + '=m' in cfg]
          assert not modular, f'Rescue-critical symbols must be =y, not =m: {modular}'
          print('Kernel config spec OK')
          "

      - name: Assert the source pin is a real commit
        run: |
          # A floating KERNEL_REF makes every build unreproducible.
          ref=$(grep -m1 '^KERNEL_REF=' config/source-lock.env | cut -d= -f2)
          echo "KERNEL_REF=$ref"
          if [ "$ref" = "HEAD" ] || [ "$ref" = "main" ] || [ -z "$ref" ]; then
            echo "FAIL: KERNEL_REF is a floating reference" >&2
            exit 1
          fi
          echo "$ref" | grep -Eq '^[0-9a-f]{7,40}$' || {
            echo "FAIL: KERNEL_REF is not a commit SHA" >&2; exit 1; }

      - name: Reject any workflow that rewrites the kernel pin
        run: |
          # A workflow that redirects a KERNEL_REF assignment into
          # config/source-lock.env silently replaces the kernel pin with the
          # builder repo's own HEAD. fetch-kernel.sh then asks the kernel
          # remote for a commit it does not have: "upload-pack: not our ref".
          # The pin must come from the committed file and nowhere else.
          # (Reading the value back and echoing it is fine; only a write is not.)
          if grep -rnE 'KERNEL_REF=.*>>?[[:space:]]*(config/)?source-lock\.env' \
               .github/ scripts/ Makefile 2>/dev/null; then
            echo "FAIL: a workflow or script writes KERNEL_REF into the lock file; the pin is committed in config/source-lock.env" >&2
            exit 1
          fi
          echo "kernel pin is only read, never written: OK"

      - name: Reject flags gh does not support
        run: |
          # `gh release create` has no --force; passing it aborts the whole
          # release AFTER a successful ~30 minute kernel build. Catch the
          # typo class here instead.
          if grep -rnE 'gh release (create|edit|upload)[^|;&]*--force' .github/ scripts/ 2>/dev/null \
             | grep -vE ':[[:space:]]*#'; then
            echo "FAIL: --force is not a valid flag for gh release create/edit/upload" >&2
            exit 1
          fi
          # Every flag used against `gh release` must exist in this gh.
          gh release create --help >/dev/null 2>&1 || {
            echo "FAIL: cannot query gh release flags" >&2; exit 1; }
          for f in --verify-tag --generate-notes --title --repo; do
            gh release create --help 2>&1 | grep -q -- "$f" || {
              echo "FAIL: gh release create does not support $f" >&2; exit 1; }
          done
          for f in --yes --repo; do
            gh release delete --help 2>&1 | grep -q -- "$f" || {
              echo "FAIL: gh release delete does not support $f" >&2; exit 1; }
          done
          echo "gh release flags verified against the installed CLI: OK"

      - name: Reject the old /boot/ USB layout
        run: |
          # The vendor loader reads fixed filenames from the ROOT of the FAT
          # stick. Any doc still telling users to create boot/ on the stick
          # produces a stick that cannot boot - fail the build instead.
          if grep -rnE 'boot/(sata\.uImage|rescue\.sata\.dtb|rescue\.root)' \
               docs/ README.md .github/ 2>/dev/null; then
            echo "FAIL: documentation still references a boot/ subdirectory on the USB stick" >&2
            exit 1
          fi
          echo "USB layout references OK (root-level only)"

      - name: Reject a partial test list in the release/build workflows
        run: |
          # release.yml's step is called "Run all tests" but used to invoke
          # three scripts by hand, so test_rootfs, test_install_verify,
          # test_image, test_dtb and test_kernel_metadata never ran in CI -
          # their guards existed only on the maintainer's machine. Naming
          # individual scripts in the publishing workflows re-introduces
          # that; `make test` is the single source of truth.
          #
          # Scoped to release.yml and build.yml on purpose: this file runs
          # test_repo_layout.sh and test_tools.sh directly because they need
          # no build artifacts and must also gate a bare pull request.
          if grep -rnE '^\s+bash tests/test_[a-z_]+\.sh' \
               .github/workflows/release.yml .github/workflows/build.yml 2>/dev/null; then
            echo "FAIL: a workflow runs individual test scripts instead of 'make test':" >&2
            exit 1
          fi
          # make test must actually be invoked, or the gate is vacuous.
          if ! grep -qE '^\s+make test\s*$' .github/workflows/release.yml; then
            echo "FAIL: release.yml does not run 'make test'" >&2
            exit 1
          fi
          echo "release and build workflows run the full suite via make test: OK"

      - name: Reject hardcoded absolute home paths
        run: |
          # A committed script carrying one developer's home directory is
          # broken for everyone else and for CI. Repo-relative paths only.
          if git grep -nE '/home/[a-z0-9_.-]+/' -- . ':!docs' 2>/dev/null; then
            echo "FAIL: a tracked file hardcodes an absolute /home/<user> path" >&2
            exit 1
          fi
          echo "no hardcoded home paths: OK"

      - name: Reject a second hand-written copy of a header check
        run: |
          # Four separate bugs in this repo came from re-implementing a check
          # that already existed in tools/: an exact grep against a decompiled
          # dtc rendering, and three struct parses with the wrong width
          # (pe_offset as <Q, text_offset as <I). A copy has no mechanism to
          # stay in sync, so the check must be the tool, not a literal.
          #
          # tools/check-image-header.py and tools/check-fdt.py are the single
          # implementations. Two things stay legal because the tools do not
          # read those fields: the UNPATCHED image's ARM64 magic at offset 56
          # (kernel/verify-kernel.sh, tests/test_kernel_metadata.sh) and the
          # structural FDT magic/totalsize in tests/test_dtb.sh.
          #
          # This file is excluded so the guard cannot match its own pattern,
          # and comment lines are dropped: documenting the contract is not
          # re-implementing it.
          bad=$(grep -rnE "unpack_from|0xd00dfeed|0x644D5241|0x91005A4D" \
                  --include='*.sh' --include='*.yml' . \
                  --exclude-dir=.git --exclude-dir=build --exclude-dir=.work \
                | grep -v '^\./\.github/workflows/validate\.yml' \
                | grep -vE '^\S+:[0-9]+:[[:space:]]*(#|//)' \
                | grep -vE 'tools/check-image-header\.py|tools/check-fdt\.py' \
                | grep -vE "unpack_from\('<I', b, 56\)|Bad ARM64 magic" \
                | grep -vE '^\./tests/test_dtb\.sh:' || true)
          if [ -n "$bad" ]; then
            echo "FAIL: a file re-implements a header check that tools/ already owns." >&2
            echo "Call tools/check-image-header.py or tools/check-fdt.py instead." >&2
            echo "$bad" >&2
            exit 1
          fi
          echo "header checks are single-sourced in tools/: OK"

      - name: Reject a test that can pass without testing anything
        run: |
          # A check that skips and reports success is worse than no check: it
          # turns a broken environment or a broken tool into a green run.
          # Three existed here - the flash.zip closure guard skipped when the
          # resolver failed, and the QEMU smoke test skipped without qemu and
          # only warned (never failed) when BusyBox would not run.
          #
          # Both shapes are caught. The skip language sits on the line ABOVE
          # `exit 0`, so the window is scanned per file rather than per line.
          # The second shape is a failure branch that only prints a warning:
          # `|| echo "WARNING: ..."` on a command whose failure matters.
          bad=""
          for f in $(git ls-files 'tests/*.sh' 'tools/*.sh' test-flash.sh); do
            [ -f "$f" ] || continue
            hit=$(awk '
              /skip|not found|unavailable|could not/ { sk = NR }
              /^[[:space:]]*exit 0/ {
                if (sk && NR - sk <= 2) { print FILENAME ":" NR }
              }
              /\|\|[[:space:]]*echo/ && /WARNING|skip|could not/ {
                print FILENAME ":" NR
              }
            ' "$f")
            [ -n "$hit" ] && bad="$bad$hit"$'\n'
          done
          if [ -n "$bad" ]; then
            echo "FAIL: these checks can report success without testing:" >&2
            echo "$bad" >&2
            echo "Exit non-zero instead - an unrun check is not a passing check." >&2
            exit 1
          fi
          echo "no check reports success without testing something: OK"

      - name: Assert the release version tracks the pinned Alpine release
        run: |
          # The tag scheme is VERSION, and VERSION encodes the Alpine release
          # in its prefix (3.21.8-9 == Alpine 3.21.8, project iteration 9).
          # That duplicates ALPINE_RELEASE from config/alpine.env in a second
          # place with nothing keeping them in step, and a mismatch ships a
          # package closure for one Alpine release under a version claiming
          # another.
          rel=$(grep -m1 '^ALPINE_RELEASE=' config/alpine.env | cut -d= -f2)
          ver=$(cat VERSION)
          echo "ALPINE_RELEASE=$rel   VERSION=$ver"
          case "$ver" in
            "$rel"-*) echo "VERSION tracks the pinned Alpine release: OK" ;;
            *) echo "FAIL: VERSION '$ver' does not start with ALPINE_RELEASE '$rel'" >&2
               echo "      The offline closure is built for $rel; the tag would claim otherwise." >&2
               exit 1 ;;
          esac
          # And the series must match too, not just the point release.
          series=$(grep -m1 '^ALPINE_VERSION=' config/alpine.env | cut -d= -f2)
          case "$rel" in
            "$series".*) : ;;
            *) echo "FAIL: ALPINE_RELEASE '$rel' is not in the pinned series '$series'" >&2; exit 1 ;;
          esac

      - name: Reject a second hardcoded copy of the Alpine version
        run: |
          # config/alpine.env is the single source. A workflow that also
          # hardcodes ALPINE_VERSION cannot be kept in step with it, and the
          # one place it was used (the CI cache key) would restore the
          # previous series' APK cache into a new-series build.
          if grep -rnE '^\s*ALPINE_(VERSION|ARCH):' .github/workflows/ 2>/dev/null; then
            echo "FAIL: a workflow hardcodes ALPINE_VERSION/ALPINE_ARCH." >&2
            echo "      Read it from config/alpine.env instead." >&2
            exit 1
          fi
          echo "Alpine version is single-sourced in config/alpine.env: OK"

      - name: Run repo layout test
        run: |
          bash tests/test_repo_layout.sh

      - name: Run test tools
        run: |
          bash tests/test_tools.sh

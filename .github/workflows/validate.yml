name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate shell scripts
        run: |
          shellcheck build-image.sh kernel/build-kernel.sh kernel/fetch-kernel.sh dtb/build-dtb.sh tools/check-deps.sh
          shellcheck rootfs/build-rootfs.sh image/package-rescue.sh image/dl-packages.sh

      - name: Validate Python scripts (syntax only)
        run: |
          python3 -m py_compile tools/check-image-header.py tools/check-fdt.py tools/resolve-apk-closure.py
          echo "Python syntax OK"

      - name: Validate kernel config against spec
        run: |
          python3 -c "
          cfg = open('config/kernel.config').read()
          required = [
              'CONFIG_AHCI_RTD1295',
              'CONFIG_R8169SOC',
              'CONFIG_PHY_RTK_RTD_SATAPHY',
              'CONFIG_USB_STORAGE',
              'CONFIG_INET',
              'CONFIG_CMDLINE',
          ]
          missing = [k for k in required if k not in cfg]
          assert not missing, f'Missing kernel config: {missing}'
          print('Kernel config spec OK')
          "

      - name: Validate USB tree layout
        run: |
          for f in boot/sata.uImage boot/rtd1295-wd-mycloud-home.dtb boot/initramfs.cfg; do
              test -f "$f" && echo "  OK: $f" || echo "  (not present yet: $f)"
          done

      - name: Run repo layout test
        run: |
          bash tests/test_repo_layout.sh

      - name: Run test tools
        run: |
          bash tests/test_tools.sh

name: Build
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            dtc u-boot-tools qemu-user-static qemu-user-binfmt \
            python3 cpio gzip xz-utils \
            crossbuild-essential-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Register QEMU binfmt
        run: |
          qemu-user-static --reset -p yes || true

      - name: Configure kernel reference
        run: |
          echo "KERNEL_REF=$(git rev-parse HEAD)" >> config/source-lock.env
          cat config/source-lock.env

      - name: Build WDMCH rescue image
        run: |
          ./build-image.sh --clean
          ./build-image.sh

      - name: Run validation tests
        run: |
          bash tests/test_tools.sh
          bash tests/qemu/smoke.sh build/rootfs "$(cat build/kernel/kernel-release.txt)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: wdmch-rescue-artifacts
          path: |
            build/release/*
            SHA256SUMS
            manifest.json

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: wdmch-rescue-artifacts
          path: build/release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/release/*
            SHA256SUMS
            manifest.json
          body: |
            # WDMCH Alpine Rescue Image
            
            ## Device
            - WD My Cloud Home (single-bay)
            - Realtek RTD1295
            - ARM64 / aarch64
            
            ## Artifacts
            - `sata.uImage` - Patched raw ARM64 Image + 512 KiB padding
            - `rescue.sata.dtb` - WDMCH device tree blob
            - `rescue.root.sata.cpio.gz_pad.img` - 4 MiB padded rescue rootfs
            
            ## Usage
            See [docs/usb-rescue.md](docs/usb-rescue.md) for instructions.
            
            ## WARNING
            - DO NOT boot GOLD partition
            - DO NOT write A/B/GOLD firmware slots
            - USB rescue is read-only with respect to the NAS

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

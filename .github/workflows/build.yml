name: WDMCH Rescue Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# WDMCH_SSH_AUTHORIZED_KEY: the operator's ed25519 public key
# (set in GitHub repo Settings → Secrets → Actions)
env:
  KERNEL_DIR: .work/monarch-6.18
  BUILD_DIR: build/kernel
  RELEASE_DIR: build/release
  USB_TREE: build/usb-tree-root

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the pinned Alpine series
        id: alpine
        run: |
          # config/alpine.env is the single source of truth for the Alpine
          # version; every build script sources it. This workflow used to
          # ALSO hardcode ALPINE_VERSION in the workflow env, used only for
          # the cache key below. Bumping config/alpine.env to a new series
          # would then download the new packages while actions/cache
          # restored the previous series' APK cache and labelled the entry
          # with the old version - a resolver running against a foreign
          # APKINDEX. Reading the value here means the key cannot disagree
          # with what the build actually downloads.
          v=$(grep -m1 '^ALPINE_VERSION=' config/alpine.env | cut -d= -f2)
          a=$(grep -m1 '^ALPINE_ARCH=' config/alpine.env | cut -d= -f2)
          if [ -z "$v" ] || [ -z "$a" ]; then
            echo "FAIL: ALPINE_VERSION/ALPINE_ARCH missing from config/alpine.env" >&2
            exit 1
          fi
          echo "Alpine pinned at $v/$a"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "arch=$a" >> "$GITHUB_OUTPUT"

      - name: Cache kernel source + Alpine APK cache
        uses: actions/cache@v6
        with:
          # The kernel source and the build-rootfs APK cache are keyed on the
          # config that produced them. The APKINDEX cache is NOT included here.
          #
          # APKINDEX.tar.gz is a snapshot of what the Alpine mirror held at some
          # moment, and mirror contents move: a point release can bump a package's
          # revision while the Alpine VERSION string stays the same. Caching it
          # on config/kernel.config meant a restore-keys hit handed the build a
          # stale index, and the download step then asked the CDN for packages
          # that index names and the mirror has already removed.
          #
          # Measured, not assumed - CI run 37173387788 on 89d5a84:
          #
          #     DL libssl3-3.3.7-r1.apk ... FAIL (after 4 retries)
          #     ERROR: 1 package(s) failed to download - the offline repo is incomplete
          #
          # while every neighbouring package in the same batch returned OK. The
          # stale index names r1; the mirror serves r2 and no longer hosts r1, so
          # the URL is a 404 and retrying it four times cannot help. A locally
          # fresh index gives 3.3.7-r2, which downloads.
          #
          # --retry was the wrong fix and it looked like the right one: it made
          # this failure durable rather than intermittent, because a 404 is
          # perfectly retryable. The index is fetched fresh each build, which is
          # a few hundred KB, and the APK cache below still avoids re-downloading
          # the packages themselves.
          path: |
            .work/monarch-6.18
            .work/apk-cache
          key: source-${{ steps.alpine.outputs.version }}-${{ steps.alpine.outputs.arch }}-${{ hashFiles('config/kernel.config', 'config/source-lock.env', 'rootfs/build-rootfs.sh') }}
          restore-keys: |
            source-${{ steps.alpine.outputs.version }}-${{ steps.alpine.outputs.arch }}-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: build/.ccache
          key: ccache-${{ hashFiles('config/kernel.config') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            ccache \
            device-tree-compiler \
            python3 \
            cpio \
            gzip \
            xz-utils \
            binutils-aarch64-linux-gnu \
            zip \
            curl \
            file \
            qemu-user qemu-user-static

      - name: Configure ccache
        run: |
          mkdir -p build/.ccache
          echo "CCACHE_DIR=build/.ccache" >> build/ccache.env
          echo "CCACHE_COMPILERCHECK=content" >> build/ccache.env
          ccache --max-size=2G
          ccache --show-stats || true

      - name: Fetch kernel source
        run: bash kernel/fetch-kernel.sh

      - name: Build kernel (Image + DTB)
        run: |
          set -a
          source config/alpine.env
          set +a
          export CC="ccache aarch64-linux-gnu-gcc"
          export CROSS_TARGET="aarch64-linux-gnu"
          export CROSS_COMPILE="${CROSS_TARGET}-"
          export PATH="/usr/bin:$PATH"
          bash kernel/build-kernel.sh
          echo "Kernel built: $(cat build/kernel/kernel-release.txt)"

      - name: Verify kernel artifacts
        run: |
          echo "=== Image ==="
          file build/kernel/Image
          echo "=== DTB ==="
          # The full validator, not an inline magic read: this is the first
          # point in the pipeline where the blob exists, so it is the cheapest
          # place to catch a wrong board before anything is packaged.
          python3 tools/check-fdt.py build/kernel/rtd1295-wd-mycloud-home.dtb
          echo "=== kernel-release.txt ==="
          cat build/kernel/kernel-release.txt

      - name: Build rescue initramfs
        env:
          WDMCH_SSH_AUTHORIZED_KEY: ${{ secrets.WDMCH_SSH_AUTHORIZED_KEY }}
        run: |
          bash rootfs/build-rootfs.sh build/rootfs "$(cat build/kernel/kernel-release.txt)"
          SIZE=$(stat -c%s build/kernel/rescue.root.sata.cpio.gz_pad.img)
          echo "Initramfs size: $SIZE bytes ($(echo "scale=2; $SIZE/1048576" | bc) MiB)"
          [ "$SIZE" -eq 4194304 ] || { echo "FAIL: size $SIZE != 4194304"; exit 1; }
          echo "PASS: initramfs is exactly 4 MiB"

      - name: Verify initramfs contents
        run: |
          echo "=== Key files ==="
          zcat build/kernel/rescue.root.sata.cpio.gz_pad.img 2>/dev/null | cpio -t 2>/dev/null | grep -E 'dropbear|authorized_keys|bin/busybox|init$|install-alpine' | sort
          echo ""
          echo "=== SSH key ==="
          zcat build/kernel/rescue.root.sata.cpio.gz_pad.img 2>/dev/null | cpio -i --to-stdout root/.ssh/authorized_keys 2>/dev/null | head -c 60
          echo ""
          echo "=== busybox static? ==="
          zcat build/kernel/rescue.root.sata.cpio.gz_pad.img 2>/dev/null | cpio -i --to-stdout bin/busybox 2>/dev/null > /tmp/busybox-extracted
          file /tmp/busybox-extracted
          rm -f /tmp/busybox-extracted

      - name: Package rescue artifacts + flash.zip
        run: |
          # Output is captured, and the tail is re-printed on failure. This step
          # runs after a 25-minute kernel build, so its own lines sit at the very
          # end of a job log that GitHub truncates - and a failure here produced
          # "Process completed with exit code 1" with nothing usable, on two
          # separate commits, because nothing said what had failed.
          #
          # This is the same reasoning as tools/ci-run-tests.sh for the test
          # suite: a failure must name itself. Re-printing the tail is what makes
          # the next occurrence diagnosable instead of another guess.
          set -o pipefail
          bash image/package-rescue.sh 2>&1 | tee /tmp/package-rescue.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo ""
            echo "## package-rescue.sh FAILED (exit $rc) - last 40 lines:"
            tail -40 /tmp/package-rescue.log
            exit "$rc"
          fi
          echo ""
          echo "=== sata.uImage ==="
          # Header fields are checked by the one correct validator; it reads
          # text_offset as the 64-bit value the ARM64 Image header actually
          # stores. The inline struct check that used to live here unpacked
          # it as <I>, which only agreed with the expected 0x200000 by
          # accident of it fitting in 32 bits.
          python3 tools/check-image-header.py build/release/sata.uImage
          # The trailing 512 KiB of zero padding is not a header field, so
          # it is still checked here.
          python3 -c "
          import os
          p='build/release/sata.uImage'
          pad=512*1024
          sz=os.path.getsize(p)
          last=open(p,'rb').read()[-pad:]
          nulls=sum(1 for b in last if b==0)
          print(f'  size={sz}')
          print(f'  padding: {nulls}/{pad} zero bytes ({100*nulls/pad:.1f}%)')
          assert nulls==pad, 'padding not zero'
          print('  padding PASS')
          "

      - name: Run validation tests
        env:
          WDMCH_SSH_AUTHORIZED_KEY: ${{ secrets.WDMCH_SSH_AUTHORIZED_KEY }}
        run: |
          # `make test` runs the full suite - it used to be missing here
          # entirely, so a pull request could merge with every test script
          # failing and this step would still report success.
          # test-flash.sh is in the Makefile too, not called separately here:
          # it validates build/flash.zip, and the release jobs that actually
          # publish that file had no way to run it.
          # ci-run-tests.sh, not a bare `make test`: it writes the failing
          # output to the job summary and an artifact. Run 37069902973 failed
          # here and GitHub served an empty log for both jobs, so the failure was
          # real but undiagnosable without repeating a 30-minute kernel build.
          bash tools/ci-run-tests.sh

      # This workflow only runs on branch pushes and PRs, never on a tag, so
      # there is no tag-specific upload to do here: release.yml is the only
      # publisher and it builds flash.zip itself from source.
      - name: Upload flash.zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: wdmch-rescue-flash
          path: build/flash.zip
          retention-days: 30
